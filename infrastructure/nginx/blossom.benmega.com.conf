server {
    listen 80;
    server_name blossom.benmega.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name blossom.benmega.com;
    client_max_body_size 500M;

    ssl_certificate     /etc/letsencrypt/live/blossom.benmega.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blossom.benmega.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve the Vite-built React SPA from frontend/dist/
    root /home/ubuntu/classroom-chat/frontend/dist;
    index index.html;

    # SPA fallback: any path that doesn't match a real file
    # is served as index.html so React Router handles client-side routing.
    # Without this, hard-refreshes or direct navigation to routes like
    # /admin/submissions return 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (they are content-hashed by Vite)
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
