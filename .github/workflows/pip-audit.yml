name: Dependency Audit

# Fails the run when pip-audit finds a known vulnerability in the backend runtime dependencies,
# so the weekly run, and a pull request that touches a requirements file, go red instead of
# passing with a list nobody reads. It is a separate workflow (not a lint.yml step) so it never
# lengthens the lint gate that deploy.yml waits for, and a new advisory cannot block a deploy.
#
# A finding that has no fixed release yet is not hidden by loosening this step: add
# `--ignore-vuln <ID>` to the command below with a comment naming the package, the advisory and
# why it cannot be fixed, and remove it once a fix ships. There are none today.
on:
  pull_request:
    paths:
      - 'backend/requirements*.txt'
      - '.github/workflows/pip-audit.yml'
  push:
    branches: [ main, working ]
    paths:
      - 'backend/requirements*.txt'
      - '.github/workflows/pip-audit.yml'
  # Advisories are published without any change in this repository, so check weekly as well.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      # The runtime requirements are what deploy.sh installs; the test tooling in
      # requirements-dev.txt never reaches the server.
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt --progress-spinner off
