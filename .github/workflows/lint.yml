name: Linting

on:
  # Push runs are limited to long-lived branches so a push to a PR branch is
  # linted once (by the pull_request run) instead of twice.
  push:
    branches: [ main, working ]
  pull_request:
  # Allow other workflows (e.g. deploy) to require this as a gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name under workflow_call, so a deploy's lint gate never queues behind a push run
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
        cache: 'pip'
        cache-dependency-path: backend/requirements-lint.txt

    - name: Install dependencies
      # Pinned in requirements-lint.txt so a ruff release cannot turn CI red by itself.
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lint.txt

    - name: Run ruff
      run: |
        ruff check .

  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: frontend/.nvmrc
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    # Fails on any high or critical advisory, except those listed with a reason in
    # scripts/npm_audit_gate.mjs. The one current entry is GHSA-qr28-fpjm-wq7f
    # (decode-uri-component, reached only through react-admin > ra-core > query-string@7). Its
    # patched release is ESM-only and query-string 7 cannot load it, so it stays allowed until
    # react-admin moves off query-string 7. Three moderate advisories remain in vitest,
    # @vitest/coverage-v8 and @vitest/mocker (test tooling only); they are below this gate.
    # For a new high, upgrade or override the package in frontend/package.json rather than
    # loosening this gate.
    - name: Audit dependencies
      run: |
        npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
        node ../scripts/npm_audit_gate.mjs "$RUNNER_TEMP/npm-audit.json"

    - name: List outdated dependencies (advisory)
      run: npm outdated || true

