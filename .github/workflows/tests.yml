name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Allow other workflows (e.g. deploy) to require this as a gate.
  workflow_call:

jobs:
  backend-tests:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Mypy
        run: python -m mypy .

      - name: Check Alembic Migration Heads
        env:
          FLASK_ENV: testing
        run: |
          HEAD_COUNT=$(python -m flask db heads | grep "(head)" | wc -l)
          if [ "$HEAD_COUNT" -gt 1 ]; then
            echo "ERROR: Multiple Alembic migration heads detected:"
            python -m flask db heads
            echo "Please run 'flask db merge heads' and commit the merge migration to resolve the branch."
            exit 1
          fi
          echo "Alembic heads check passed. Only one head detected."

      - name: Run Pytest
        env:
          FLASK_ENV: testing
        run: pytest

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Vitest
        run: npm run test -- --run --coverage

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npm run test:e2e
