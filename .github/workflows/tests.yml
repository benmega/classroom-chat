name: Tests

on:
  # Pushes run on the long-lived branches only; every other branch is tested by its
  # pull_request run, so a push to a PR branch is not tested twice. Pull requests are
  # tested whatever their base branch is (feature branches get stacked on each other).
  push:
    branches: [ main, working ]
  pull_request:
  # Allow other workflows (e.g. deploy) to require this as a gate.
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight. Runs on main, working
# and the deploy gate are never cancelled, so every pushed commit keeps a result.
# github.workflow is the calling workflow's name when this file is reused, so the two
# deploy workflows (which both call it for the same ref) do not queue behind each other.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            .github/scripts/requirements.txt

      - name: Install dependencies
        # requirements-dev.txt = requirements.txt + pytest, mypy and the other test tooling.
        # The AI workflow scripts' requirements are installed too, so their tests run instead of
        # being skipped for the missing openai package.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r ../.github/scripts/requirements.txt
      - name: Run Mypy
        run: python -m mypy .

      - name: Check Alembic Migration Heads
        env:
          FLASK_ENV: testing
        run: |
          HEAD_COUNT=$(python -m flask db heads | grep "(head)" | wc -l)
          if [ "$HEAD_COUNT" -gt 1 ]; then
            echo "ERROR: Multiple Alembic migration heads detected:"
            python -m flask db heads
            echo "Please run 'flask db merge heads' and commit the merge migration to resolve the branch."
            exit 1
          fi
          echo "Alembic heads check passed. Only one head detected."

      # Static checks over the route and migration files (plain AST/text scans; no app or
      # database is started, so no environment is needed). `flask db check` is deliberately not
      # run here: it cannot pass until the migration chain is repaired (#60).
      - name: Check admin route guards and migrations
        run: |
          python scripts/check_admin_auth.py
          python scripts/lint_migrations.py
          python scripts/validate_migrations.py

      - name: Run Pytest
        env:
          FLASK_ENV: testing
        run: pytest

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Vitest
        run: npm run test -- --coverage

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
          
      - name: Install Backend Dependencies
        # Runtime only: this job just starts `python main.py` for the E2E run.
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: |
          # Seed E2E test users
          cd ../backend
          export FLASK_ENV="development"
          python scripts/seed_e2e_users.py
          
          # Start backend in the background
          export FLASK_USE_RELOADER="False"
          export FLASK_DEBUG="True"
          python main.py &
          BACKEND_PID=$!
          
          # Wait for backend to be ready
          sleep 5
          
          # Run frontend tests
          cd ../frontend
          npm run test:e2e
          
          # Tear down backend
          kill $BACKEND_PID
